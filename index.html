<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本周核心数据</title>
  <link rel="stylesheet" href="./styles.css?v=20260807-2" />
</head>
<body>
  <div class="page" id="captureTarget">
    <header class="hero">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>本周核心数据</h1>
        <p class="subtle">按最新模板上传 Excel，一页展示全部模块，支持截图与模板下载。</p>
      </div>
      <div class="hero-side">
        <div id="todayDate" class="today-date" aria-live="polite"></div>
        <div class="toolbar no-capture">
          <label class="upload-button">
            <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
            上传 Excel
          </label>
          <a class="secondary-link" href="./周维度经营看板上传模板.xlsx" download>下载 Excel 模板</a>
          <button id="screenshotButton" class="secondary" type="button">下载页面截图</button>
          <button id="demoButton" class="secondary" type="button">恢复示例</button>
        </div>
      </div>
    </header>

    <section class="panel control-panel">
      <div class="control-group">
        <label for="statusText">当前状态</label>
        <div id="statusText" class="status">已加载示例数据</div>
      </div>
    </section>

    <section class="section">
      <div class="section-title">本周核心数据</div>
      <div id="overviewSummary" class="overview-summary" hidden></div>
      <div id="overviewGrid" class="kpi-grid"></div>
    </section>

    <section class="section">
      <div class="section-title">单页周报</div>
      <div id="dashboardContent" class="dashboard-content"></div>
    </section>

    <aside id="versionMeta" class="page-meta-corner" aria-live="polite"></aside>
  </div>

  <script src="./assets/js/xlsx.full.min.js?v=20260807-2"></script>
  <script src="./assets/js/html2canvas.min.js?v=20260807-2"></script>
  <script src="./app.js?v=20260807-2"></script>
</body>
</html>
